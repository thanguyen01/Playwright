<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playwright Playground</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 2rem;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { color: white; text-align: center; margin-bottom: 2rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
    .card {
      background: white; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .card h2 { color: #667eea; margin-bottom: 1rem; font-size: 1.25rem; border-bottom: 2px solid #667eea; padding-bottom: 0.5rem; }
    label { display: block; margin-bottom: 0.5rem; color: #333; font-weight: 500; }
    input[type="text"], input[type="email"], input[type="password"], select, textarea {
      width: 100%; padding: 0.75rem; border: 2px solid #e0e0e0; border-radius: 6px;
      font-size: 1rem; margin-bottom: 1rem; transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #667eea; }
    .btn {
      padding: 0.75rem 1.5rem; border: none; border-radius: 6px; font-size: 1rem;
      cursor: pointer; transition: transform 0.1s, box-shadow 0.2s;
      margin-right: 0.5rem; margin-bottom: 0.5rem;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
    .btn-primary { background: #667eea; color: white; }
    .btn-success { background: #48bb78; color: white; }
    .btn-danger { background: #f56565; color: white; }
    .btn-warning { background: #ed8936; color: white; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid #e0e0e0; }
    th { background: #667eea; color: white; }
    tr:hover { background: #f7fafc; }
    .alert { padding: 1rem; border-radius: 6px; margin-bottom: 1rem; display: none; }
    .alert-success { background: #c6f6d5; color: #22543d; border: 1px solid #48bb78; }
    .alert-error { background: #fed7d7; color: #742a2a; border: 1px solid #f56565; }
    .error-text { color: #f56565; font-size: 0.875rem; margin-top: -0.5rem; margin-bottom: 1rem; display: none; }
    .hidden { display: none; }
    .user-info { background: #667eea; color: white; padding: 1rem; border-radius: 6px; margin-bottom: 1rem; }
    .api-response { background: #1a202c; color: #48bb78; padding: 1rem; border-radius: 6px; font-family: monospace; overflow-x: auto; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎯 Playwright Playground</h1>

    <!-- Login Section -->
    <div class="card" id="login-card" role="region" aria-labelledby="login-title">
      <h2 id="login-title">🔐 Login</h2>
      <div id="login-alert" class="alert"></div>
      <form id="login-form" role="form" aria-label="Login form">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter username" data-testid="username-input" autocomplete="username">
        <div class="error-text" id="username-error">Username is required</div>
        
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter password" data-testid="password-input" autocomplete="current-password">
        <div class="error-text" id="password-error">Password is required</div>
        
        <button type="submit" class="btn btn-primary" data-testid="login-btn">Sign In</button>
        <button type="reset" class="btn btn-danger" data-testid="reset-btn">Reset</button>
      </form>
      <p style="margin-top: 1rem; color: #666;">
        <small>💡 Default user: <strong>admin</strong> / <strong>admin123</strong></small>
      </p>
    </div>

    <!-- Logged In Content (hidden until login) -->
    <div id="logged-in-content" class="hidden">
      <div class="user-info">
        <span>👤 Welcome, <strong id="current-user">admin</strong></span>
        <button class="btn btn-danger" onclick="logout()" style="float: right;" data-testid="logout-btn">Logout</button>
      </div>

      <!-- Employee Management -->
      <div class="card" role="region" aria-labelledby="employee-title">
        <h2 id="employee-title">👥 Employee Management</h2>
        <div id="employee-alert" class="alert"></div>
        
        <form id="employee-form" role="form" aria-label="Employee form">
          <label for="emp-name">Name</label>
          <input type="text" id="emp-name" data-testid="emp-name-input" placeholder="Employee name">
          
          <label for="emp-department">Department</label>
          <select id="emp-department" data-testid="emp-department-select">
            <option value="">Select Department</option>
            <option value="Engineering">Engineering</option>
            <option value="Marketing">Marketing</option>
            <option value="Sales">Sales</option>
            <option value="HR">Human Resources</option>
            <option value="Finance">Finance</option>
          </select>
          
          <label for="emp-status">Status</label>
          <select id="emp-status" data-testid="emp-status-select">
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
            <option value="On Leave">On Leave</option>
          </select>
          
          <button type="submit" class="btn btn-success" data-testid="add-employee-btn">+ Add Employee</button>
        </form>

        <div style="margin-top: 1rem;">
          <input type="text" id="search-input" placeholder="Search employees..." data-testid="search-input" style="width: 250px; display: inline-block;">
          <button class="btn btn-primary" onclick="searchEmployees()" data-testid="search-btn">Search</button>
          <button class="btn btn-warning" onclick="loadEmployees()" data-testid="refresh-btn">Refresh</button>
        </div>
        
        <table id="employees-table" data-testid="employees-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Department</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="employees-tbody">
            <!-- Populated by JavaScript -->
          </tbody>
        </table>
      </div>

      <!-- API Testing Section -->
      <div class="card" role="region" aria-labelledby="api-title">
        <h2 id="api-title">🔌 API Testing</h2>
        <div id="api-alert" class="alert"></div>
        
        <label for="api-endpoint">API Endpoint</label>
        <select id="api-endpoint" data-testid="api-endpoint-select">
          <option value="/api/employees">GET /api/employees</option>
          <option value="/api/employees/1">GET /api/employees/1</option>
          <option value="/api/user">GET /api/user</option>
          <option value="/api/stats">GET /api/stats</option>
        </select>
        
        <button class="btn btn-primary" onclick="callAPI()" data-testid="api-call-btn">Call API</button>
        
        <div id="api-response" class="api-response" data-testid="api-response">
          // API response will appear here...
        </div>
      </div>
    </div>
  </div>

  <script>
    // State
    let currentUser = null;
    let employees = [
      { id: 1, name: 'John Doe', department: 'Engineering', status: 'Active' },
      { id: 2, name: 'Jane Smith', department: 'Marketing', status: 'Active' },
      { id: 3, name: 'Bob Wilson', department: 'Sales', status: 'Inactive' },
      { id: 4, name: 'Alice Brown', department: 'HR', status: 'Active' },
      { id: 5, name: 'Charlie Davis', department: 'Finance', status: 'On Leave' }
    ];
    let nextId = 6;

    // Mock API responses
    const mockAPI = {
      '/api/employees': () => ({ success: true, data: employees, count: employees.length }),
      '/api/employees/1': () => ({ success: true, data: employees[0] }),
      '/api/user': () => currentUser ? { success: true, user: currentUser } : { success: false, error: 'Not authenticated' },
      '/api/stats': () => ({
        success: true,
        stats: {
          totalEmployees: employees.length,
          activeCount: employees.filter(e => e.status === 'Active').length,
          departments: [...new Set(employees.map(e => e.department))].length
        }
      })
    };

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      checkLogin();
      loadEmployees();
    });

    // Login functionality
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const alert = document.getElementById('login-alert');
      
      let hasError = false;
      
      if (!username) {
        document.getElementById('username-error').style.display = 'block';
        hasError = true;
      } else {
        document.getElementById('username-error').style.display = 'none';
      }
      
      if (!password) {
        document.getElementById('password-error').style.display = 'block';
        hasError = true;
      } else {
        document.getElementById('password-error').style.display = 'none';
      }
      
      if (hasError) {
        showAlert(alert, 'Please fix the errors above', 'error');
        return;
      }
      
      // Simple authentication
      if (username === 'admin' && password === 'admin123') {
        currentUser = { username: 'admin', role: 'Administrator', email: 'admin@playground.local' };
        localStorage.setItem('playground_user', JSON.stringify(currentUser));
        showAlert(alert, 'Login successful! Welcome, ' + username, 'success');
        setTimeout(() => {
          showLoggedInContent();
        }, 1000);
      } else {
        showAlert(alert, 'Invalid credentials. Try admin / admin123', 'error');
      }
    });

    function checkLogin() {
      const saved = localStorage.getItem('playground_user');
      if (saved) {
        currentUser = JSON.parse(saved);
        showLoggedInContent();
      }
    }

    function showLoggedInContent() {
      document.getElementById('login-card').classList.add('hidden');
      document.getElementById('logged-in-content').classList.remove('hidden');
      document.getElementById('current-user').textContent = currentUser.username;
      loadEmployees();
    }

    function logout() {
      currentUser = null;
      localStorage.removeItem('playground_user');
      document.getElementById('login-card').classList.remove('hidden');
      document.getElementById('logged-in-content').classList.add('hidden');
      document.getElementById('login-form').reset();
    }

    // Employee management
    function loadEmployees() {
      const tbody = document.getElementById('employees-tbody');
      tbody.innerHTML = '';
      
      employees.forEach(emp => {
        const row = document.createElement('tr');
        row.setAttribute('data-testid', `employee-row-${emp.id}`);
        row.innerHTML = `
          <td>${String(emp.id).padStart(3, '0')}</td>
          <td>${emp.name}</td>
          <td>${emp.department}</td>
          <td><span class="status-${emp.status.toLowerCase().replace(' ', '-')}">${emp.status}</span></td>
          <td>
            <button class="btn btn-primary btn-sm" onclick="editEmployee(${emp.id})" data-testid="edit-btn-${emp.id}">Edit</button>
            <button class="btn btn-danger btn-sm" onclick="deleteEmployee(${emp.id})" data-testid="delete-btn-${emp.id}">Delete</button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    document.getElementById('employee-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const name = document.getElementById('emp-name').value.trim();
      const department = document.getElementById('emp-department').value;
      const status = document.getElementById('emp-status').value;
      const alert = document.getElementById('employee-alert');
      
      if (!name || !department) {
        showAlert(alert, 'Please fill in all required fields', 'error');
        return;
      }
      
      const newEmployee = { id: nextId++, name, department, status };
      employees.push(newEmployee);
      loadEmployees();
      
      showAlert(alert, `Employee "${name}" added successfully!`, 'success');
      this.reset();
    });

    function deleteEmployee(id) {
      const index = employees.findIndex(e => e.id === id);
      if (index > -1) {
        const name = employees[index].name;
        employees.splice(index, 1);
        loadEmployees();
        showAlert(document.getElementById('employee-alert'), `Employee "${name}" deleted`, 'success');
      }
    }

    function editEmployee(id) {
      const emp = employees.find(e => e.id === id);
      if (emp) {
        document.getElementById('emp-name').value = emp.name;
        document.getElementById('emp-department').value = emp.department;
        document.getElementById('emp-status').value = emp.status;
      }
    }

    function searchEmployees() {
      const searchTerm = document.getElementById('search-input').value.toLowerCase();
      const rows = document.querySelectorAll('#employees-tbody tr');
      
      rows.forEach(row => {
        const name = row.cells[1].textContent.toLowerCase();
        row.style.display = name.includes(searchTerm) ? '' : 'none';
      });
    }

    // API Testing
    function callAPI() {
      const endpoint = document.getElementById('api-endpoint').value;
      const responseDiv = document.getElementById('api-response');
      const alert = document.getElementById('api-alert');
      
      responseDiv.textContent = 'Loading...';
      
      setTimeout(() => {
        try {
          const result = mockAPI[endpoint] ? mockAPI[endpoint]() : { error: 'Endpoint not found' };
          responseDiv.textContent = JSON.stringify(result, null, 2);
          showAlert(alert, 'API call successful', 'success');
        } catch (error) {
          responseDiv.textContent = `Error: ${error.message}`;
          showAlert(alert, 'API call failed', 'error');
        }
      }, 500);
    }

    // Utility
    function showAlert(element, message, type) {
      element.className = `alert alert-${type}`;
      element.textContent = message;
      element.style.display = 'block';
      setTimeout(() => {
        element.style.display = 'none';
      }, 3000);
    }
  </script>
</body>
</html>
